<!DOCTYPE html>
<html lang="en">
{% load static %}

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
    integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
  <link rel="stylesheet" href="{% static 'styles.css' %}" />
  <title>YMCA formulario de asistencia</title>
</head>

<body>
  <div class="principal_div">
    <h1 class="mt-5 mb-5">YMCA - Formulario de Asistencia</h1>
    {% if messages %}
    {% for message in messages %}
    <a class="alert alert-success">{{ message }}</a>
    {% endfor %}
    {% endif %}
    <form method="POST">
      {% csrf_token %}
      <div class="form-group">
        <label for="identification">Número de documento: </label>
        <input type="number" name="identification" class="form-control" id="identification"
          placeholder="Ingrese su número de documento">
      </div>
      <button type="submit" class="btn btn-primary">Validar</button>
    </form>
  </div>

</body>

</html>
